server:
  port: 9010

spring:
  application:
    name: messageserver
  cloud:
    function:
      definition: email|sms
    stream:
      bindings:
        emailsms-in-0:
          destination: "send-communication"
          group: ${spring.application.name} #defines the consumer group for an inbound message channel
        emailsms-out-0:
          destination: "send-communication-conformation"
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    connection-timeout: 10s
