spring:
  application:
    name: eurekaserver
  config:
    import: ${SPRING_CONFIG_IMPORT:configserver:http://localhost:8071/}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"

management:
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "*"

metrics:
  tags:
    application: ${spring.application.name}