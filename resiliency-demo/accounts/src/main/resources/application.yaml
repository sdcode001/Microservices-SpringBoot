spring:
  application:
    name: "accounts"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  config:
    import: ${SPRING_CONFIG_IMPORT:configserver:http://localhost:8071/}
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true


eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8070/eureka/}

info:
  app:
    name: "accounts"
    description: "Easy Bank Accounts Service"
    version: 1.0.0

management:
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      enabled: true
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

endpoints:
  shutdown:
    enabled: true


resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10 # The number of calls recorded in a sliding window to calculate the failure rate.
      permittedNumberOfCallsInHalfOpenState: 2 # The number of trial calls allowed when the circuit breaker is in the HALF_OPEN state.
      failureRateThreshold: 50 # The percentage threshold at which the circuit opens.
      waitDurationInOpenState: 10000 # The time(in ms) the circuit stays OPEN before transitioning to HALF_OPEN.


resilience4j.retry:
  configs:
    default:
      maxAttempts: 3
      waitDuration: 200
      enableExponentialBackoff: true
      exponentialBackoffMultiplier: 2
      ignoreExceptions:
        - java.lang.NullPointerException
      retryExceptions:
        - java.util.concurrent.TimeoutException