spring:
  application:
    name: "cards"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  config:
    import: ${SPRING_CONFIG_IMPORT:configserver:http://localhost:8071/}

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8070/eureka/}

resilience4j.ratelimiter:
  configs:
    default:
      timeoutDuration: 1000 # The maximum duration a thread will wait for a permission (rate limit token) before failing.
      limitRefreshPeriod: 5000 # The time frame after which request quota(limitForPeriod) will renew.
      limitForPeriod: 3 # The number of request allowed within limitRefreshPeriod (quota)

info:
  app:
    name: "cards"
    description: "Easy Bank Cards Service"
    version: 1.0.0

management:
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      enabled: true
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

endpoints:
  shutdown:
    enabled: true


